name: PopinVR
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PopinVRTracking:
    path: .

targets:
  PopinVR:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
      - path: Models
        type: folder
        buildPhase: resources
    dependencies:
      - package: PopinVRTracking
        product: PopinVRTracking
      - framework: Vendor/MoltenVK.framework
        embed: true
    info:
      path: App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.popinvr.ios
        PRODUCT_NAME: PopinVR
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "2"
        MARKETING_VERSION: "0.2.0"
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
