name: iPhone runtime integration

concurrency:
  group: ios-runtime-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - ios/husk-runtime-integration
      - ios/quest-integration
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  husk-full-app:
    name: Integrated Husk + iQuest IPA
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Checkout iQuest/Klepton
        uses: actions/checkout@v4
        with:
          path: iquest
      - name: Install build tools
        run: |
          brew install meson ninja pkg-config xcodegen qemu cmake gn autoconf automake libtool
          rustup target add aarch64-apple-ios
      - name: Validate integration script syntax
        working-directory: iquest
        run: bash -n scripts/integrate_husk_ios.sh
      - name: Assemble pinned Husk app with iQuest XR bridge
        working-directory: iquest
        run: |
          chmod +x scripts/integrate_husk_ios.sh
          HUSK_DIR="$GITHUB_WORKSPACE/deps/Husk" scripts/integrate_husk_ios.sh
      - name: Build complete app and IPA
        working-directory: deps/Husk
        run: |
          chmod +x scripts/ci_build.sh
          ./scripts/ci_build.sh "$GITHUB_WORKSPACE/iquest/build/iQuest-Husk.ipa"
      - name: Upload integrated IPA
        uses: actions/upload-artifact@v4
        with:
          name: iquest-husk-ipa
          path: iquest/build/iQuest-Husk.ipa
          if-no-files-found: error
          retention-days: 14
