name: iPhone runtime integration

on:
  push:
    branches:
      - ios/husk-runtime-integration
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  klepton-host-tests:
    name: Existing Klepton host regression suite
    runs-on: macos-15
    steps:
      - name: Checkout iQuest/Klepton
        uses: actions/checkout@v4
      - name: Run host regression suite
        run: make check

  klepton-ios:
    name: Klepton C runtime -> iOS arm64
    runs-on: macos-15
    steps:
      - name: Checkout iQuest/Klepton
        uses: actions/checkout@v4
      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Build iOS runtime dylib
        run: make ios-runtime
      - name: Upload iOS runtime (not an IPA)
        uses: actions/upload-artifact@v4
        with:
          name: klepton-ios-runtime
          path: build/ios/libklepton-ios.dylib
          if-no-files-found: error
          retention-days: 14

  husk-ios-compile:
    name: Husk translation-layer iOS compile smoke test
    runs-on: macos-15
    steps:
      - name: Checkout pinned Husk source
        uses: actions/checkout@v4
        with:
          repository: Leviidev/Husk
          ref: 29abb512d81bf8cc08babcbe7f7007cb557208ef
          path: deps/Husk

      - name: Syntax-check the selected Husk runtime seams for iOS
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          SRC="deps/Husk/src/translation-layer-next"
          for file in \
            husk-tl-a64.c \
            husk-tl-ld.c \
            husk-tl-bionic.c \
            husk-tl-jni.c \
            husk-tl-xmem.c \
            husk-tl-unity.c \
            husk-tl-nativeactivity.c
          do
            echo "::group::iOS syntax check: $file"
            xcrun --sdk iphoneos clang \
              -target arm64-apple-ios17.0 \
              -isysroot "$SDK" \
              -std=gnu11 \
              -Wno-everything \
              -I "$SRC" \
              -I "deps/Husk/src/translation-layer" \
              -fsyntax-only "$SRC/$file"
            echo "::endgroup::"
          done

  husk-full-app:
    name: Integrated Husk + iQuest IPA
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Checkout iQuest/Klepton
        uses: actions/checkout@v4
        with:
          path: iquest
      - name: Install build tools
        run: |
          brew install meson ninja pkg-config xcodegen qemu
          rustup target add aarch64-apple-ios
      - name: Assemble pinned Husk app with iQuest XR bridge
        working-directory: iquest
        run: |
          chmod +x scripts/integrate_husk_ios.sh
          HUSK_DIR="$GITHUB_WORKSPACE/deps/Husk" scripts/integrate_husk_ios.sh
      - name: Build complete app and IPA
        working-directory: deps/Husk
        run: |
          chmod +x scripts/ci_build.sh
          ./scripts/ci_build.sh "$GITHUB_WORKSPACE/iquest/build/iQuest-Husk.ipa"
      - name: Upload integrated IPA
        uses: actions/upload-artifact@v4
        with:
          name: iquest-husk-ipa
          path: iquest/build/iQuest-Husk.ipa
          if-no-files-found: error
          retention-days: 14
