name: PopinVR iOS validation

concurrency:
  group: popinvr-ios-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - ios/popinvr-tracking-foundation
  pull_request:
    paths:
      - "ios/**"
      - "runtime/**"
      - "Makefile"
      - ".github/workflows/popinvr-ios.yml"

jobs:
  ios-runtime:
    name: Compile Klepton runtime for iPhoneOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Compile and link iOS runtime
        run: make ios-device

  ios-app:
    name: Build PopinVR iOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml
      - name: Build and package unsigned iOS app
        working-directory: ios
        run: bash build_app.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: PopinVR-unsigned-ipa
          path: ios/build/PopinVR-unsigned.ipa
          if-no-files-found: error
